<!DOCTYPE HTML>
<html>
<head>
<title>Cart - EcoWorld.earth</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
<link rel="stylesheet" href="assets/css/marketplace.css" />
<style>
  .cart-page { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1rem; }
  .cart-page h1 { font-size: 1.8rem; color: #1b5e20; font-weight: 700; margin-bottom: 1.5rem; }

  /* Empty Cart */
  .cart-empty {
    text-align: center; padding: 4rem 1rem;
  }
  .cart-empty i { font-size: 4rem; color: #c8e6c9; margin-bottom: 1rem; }
  .cart-empty h2 { color: #555; font-weight: 600; margin-bottom: 0.5rem; }
  .cart-empty p { color: #888; margin-bottom: 1.5rem; }
  .cart-empty a {
    display: inline-block; padding: 0.8rem 2rem;
    background: #2e7d32; color: #fff; border-radius: 8px;
    text-decoration: none; font-weight: 600; transition: all 0.3s;
  }
  .cart-empty a:hover { background: #1b5e20; }

  /* Cart Layout */
  .cart-layout { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; align-items: start; }

  /* Cart Items */
  .cart-items { display: flex; flex-direction: column; gap: 1rem; }
  .cart-item {
    display: grid; grid-template-columns: 80px 1fr auto;
    gap: 1rem; align-items: center;
    background: #fff; border-radius: 10px; border: 1px solid #e8f5e9;
    padding: 1rem; transition: all 0.2s;
  }
  .cart-item:hover { box-shadow: 0 2px 10px rgba(46,125,50,0.08); }
  .cart-item-image {
    width: 80px; height: 80px; background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
  }
  .cart-item-image i { font-size: 1.8rem; color: #a5d6a7; }
  .cart-item-info h3 { font-size: 0.95rem; color: #333; font-weight: 600; margin-bottom: 0.3rem; }
  .cart-item-variants { font-size: 0.8rem; color: #777; margin-bottom: 0.5rem; }
  .cart-item-variants span {
    display: inline-block; background: #f5f5f5; padding: 0.15rem 0.5rem;
    border-radius: 4px; margin-right: 0.3rem; margin-bottom: 0.2rem;
  }
  .cart-item-actions { display: flex; align-items: center; gap: 1rem; }
  .cart-item-qty { display: flex; align-items: center; gap: 0; }
  .cart-item-qty button {
    width: 30px; height: 30px; border: 1px solid #ddd;
    background: #fff; cursor: pointer; font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .cart-item-qty button:first-child { border-radius: 4px 0 0 4px; }
  .cart-item-qty button:last-child { border-radius: 0 4px 4px 0; }
  .cart-item-qty button:hover { background: #e8f5e9; color: #2e7d32; }
  .cart-item-qty input {
    width: 40px; height: 30px; border: 1px solid #ddd; border-left: none; border-right: none;
    text-align: center; font-size: 0.85rem; font-weight: 600;
    -moz-appearance: textfield;
  }
  .cart-item-qty input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .cart-item-price { font-weight: 700; color: #2e7d32; font-size: 0.95rem; white-space: nowrap; }
  .cart-item-remove {
    background: none; border: none; color: #e53935; cursor: pointer;
    font-size: 1rem; padding: 0.3rem; transition: all 0.2s;
  }
  .cart-item-remove:hover { transform: scale(1.2); }
  .cart-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }

  /* Cart Summary */
  .cart-summary {
    background: #fff; border-radius: 12px; border: 1px solid #e8f5e9;
    padding: 1.5rem; position: sticky; top: 90px;
  }
  .cart-summary h2 { font-size: 1.1rem; color: #333; margin-bottom: 1rem; font-weight: 700; }
  .summary-line {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.5rem 0; font-size: 0.9rem; color: #555;
  }
  .summary-line.total {
    font-weight: 700; color: #1b5e20; font-size: 1.1rem;
    border-top: 2px solid #e8f5e9; margin-top: 0.5rem; padding-top: 0.8rem;
  }
  .summary-note {
    font-size: 0.8rem; color: #888; margin-top: 1rem; padding: 0.6rem;
    background: #fafafa; border-radius: 6px; text-align: center;
  }
  .checkout-btn {
    width: 100%; padding: 1rem; background: #2e7d32; color: #fff;
    border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
    cursor: pointer; margin-top: 1rem; transition: all 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .checkout-btn:hover { background: #1b5e20; transform: translateY(-1px); box-shadow: 0 4px 15px rgba(46,125,50,0.3); }
  .clear-cart-btn {
    width: 100%; padding: 0.6rem; background: none; border: 1px solid #e53935;
    border-radius: 6px; color: #e53935; font-size: 0.8rem; font-weight: 500;
    cursor: pointer; margin-top: 0.5rem; transition: all 0.2s;
  }
  .clear-cart-btn:hover { background: #ffebee; }

  @media (max-width: 768px) {
    .cart-layout { grid-template-columns: 1fr; }
    .cart-item { grid-template-columns: 60px 1fr; }
    .cart-item-right { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
    .cart-summary { position: static; }
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav class="nav">
  <a href="index.html" class="nav-brand">Eco<span>World</span>.earth</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li class="nav-cart"><a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span></a></li>
  </ul>
</nav>

<!-- Breadcrumb -->
<div class="breadcrumb" style="padding-top:5rem;">
  <a href="index.html">Home</a><span class="sep">/</span>
  <span>Cart</span>
</div>

<!-- Cart Content -->
<div class="cart-page" id="cartPage"></div>

<!-- Footer -->
<footer class="site-footer">
  <div>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="privacy-policy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </div>
  <p class="footer-copy">&copy; 2025 EcoWorld Earth Products. All rights reserved.</p>
</footer>

<script src="assets/js/products-data.js"></script>
<script>
  function renderCart() {
    const cart = getCart();
    const container = document.getElementById('cartPage');

    if (cart.length === 0) {
      container.innerHTML = `
        <div class="cart-empty">
          <i class="fas fa-shopping-cart"></i>
          <h2>Your cart is empty</h2>
          <p>Browse our eco-friendly products and add items to your cart.</p>
          <a href="products.html">Browse Products</a>
        </div>
      `;
      return;
    }

    let itemsHtml = '';
    let itemCount = 0;
    let totalPrice = 0;
    let hasQuoteItems = false;

    cart.forEach((item, index) => {
      const productInfo = getProductById(item.productId);
      const name = productInfo ? productInfo.product.name : item.productId;
      const icon = productInfo ? productInfo.category.icon : 'fas fa-box';

      // Build variant display
      let variantHtml = '';
      if (item.variants && Object.keys(item.variants).length > 0) {
        variantHtml = Object.entries(item.variants).map(([k, v]) =>
          `<span>${k.replace(/([A-Z])/g, ' $1').trim()}: ${v}</span>`
        ).join('');
      }

      const lineTotal = item.price * item.quantity;
      totalPrice += lineTotal;
      itemCount += item.quantity;
      if (item.price === 0) hasQuoteItems = true;

      itemsHtml += `
        <div class="cart-item" data-index="${index}">
          <div class="cart-item-image"><i class="${icon}"></i></div>
          <div class="cart-item-info">
            <h3>${name}</h3>
            <div class="cart-item-variants">${variantHtml}</div>
            <div class="cart-item-qty">
              <button onclick="changeQty(${index}, -1)">−</button>
              <input type="number" value="${item.quantity}" min="1" onchange="setQty(${index}, this.value)">
              <button onclick="changeQty(${index}, 1)">+</button>
            </div>
          </div>
          <div class="cart-item-right">
            <div class="cart-item-price">${item.price > 0 ? '₹' + lineTotal.toLocaleString('en-IN') : 'Quote'}</div>
            <button class="cart-item-remove" onclick="removeItem(${index})" title="Remove"><i class="fas fa-trash-alt"></i></button>
          </div>
        </div>
      `;
    });

    container.innerHTML = `
      <h1>Your Cart (${itemCount} item${itemCount > 1 ? 's' : ''})</h1>
      <div class="cart-layout">
        <div class="cart-items">${itemsHtml}</div>
        <div class="cart-summary">
          <h2>Order Summary</h2>
          <div class="summary-line"><span>Items</span><span>${itemCount}</span></div>
          <div class="summary-line"><span>Subtotal</span><span>${totalPrice > 0 ? '₹' + totalPrice.toLocaleString('en-IN') : 'Quote on request'}</span></div>
          <div class="summary-line total"><span>Total</span><span>${totalPrice > 0 ? '₹' + totalPrice.toLocaleString('en-IN') : 'Request Quote'}</span></div>
          ${hasQuoteItems ? `<div class="summary-note">Some items require a custom quote. We'll provide pricing after checkout.</div>` : ''}
          <button class="checkout-btn" onclick="checkout()"><i class="fab fa-whatsapp"></i> Checkout via WhatsApp</button>
          <button class="clear-cart-btn" onclick="clearCartAction()"><i class="fas fa-trash"></i> Clear Cart</button>
        </div>
      </div>
    `;
  }

  function changeQty(index, delta) {
    const cart = getCart();
    if (!cart[index]) return;
    const newQty = cart[index].quantity + delta;
    if (newQty < 1) return;
    updateCartItemQty(index, newQty);
    renderCart();
    updateNavCartBadge();
  }

  function setQty(index, val) {
    const qty = parseInt(val) || 1;
    if (qty < 1) return;
    updateCartItemQty(index, qty);
    renderCart();
    updateNavCartBadge();
  }

  function removeItem(index) {
    removeFromCart(index);
    renderCart();
    updateNavCartBadge();
  }

  function clearCartAction() {
    if (confirm('Are you sure you want to clear your cart?')) {
      clearCart();
      renderCart();
      updateNavCartBadge();
    }
  }

  function checkout() {
    const cart = getCart();
    if (cart.length === 0) return;

    let msg = '🛒 *EcoWorld Order Request*\n\n';
    cart.forEach((item, i) => {
      const productInfo = getProductById(item.productId);
      const name = productInfo ? productInfo.product.name : item.productId;
      msg += `${i + 1}. *${name}*\n`;
      if (item.variants && Object.keys(item.variants).length) {
        Object.entries(item.variants).forEach(([k, v]) => {
          msg += `   ${k}: ${v}\n`;
        });
      }
      msg += `   Qty: ${item.quantity}`;
      if (item.price > 0) msg += ` | ₹${(item.price * item.quantity).toLocaleString('en-IN')}`;
      msg += '\n\n';
    });

    const total = getCartTotal();
    if (total > 0) msg += `*Total: ₹${total.toLocaleString('en-IN')}*\n`;
    msg += '\nPlease confirm availability and delivery details.';

    const phone = STORE_CONFIG.whatsapp || '919876543210';
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  renderCart();
  updateNavCartBadge();
</script>
</body>
</html>
