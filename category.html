<!DOCTYPE HTML>
<html>
<head>
<title>Category - EcoWorld.earth</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
<link rel="stylesheet" href="assets/css/marketplace.css" />
</head>
<body>

<!-- Navigation -->
<nav class="nav">
  <a href="index.html" class="nav-brand">Eco<span>World</span>.earth</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li class="nav-cart"><a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span></a></li>
  </ul>
</nav>

<!-- Breadcrumb -->
<div class="breadcrumb" style="padding-top:5rem;" id="breadcrumb"></div>

<!-- Page Header -->
<div class="page-header" id="pageHeader"></div>

<!-- Sub-Category Cards Grid -->
<div class="card-grid" id="subcategoryGrid"></div>

<!-- Info Bar -->
<div class="info-bar">
  <div class="info-bar-item"><i class="fas fa-boxes"></i> Bulk Orders Accepted</div>
  <div class="info-bar-item"><i class="fas fa-file-invoice"></i> GST Invoice Available</div>
  <div class="info-bar-item"><i class="fas fa-ruler-combined"></i> Custom Sizing on Request</div>
  <div class="info-bar-item"><i class="fas fa-truck"></i> Pan-India Delivery</div>
</div>

<!-- Footer -->
<footer class="site-footer">
  <div>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="privacy-policy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </div>
  <p class="footer-copy">&copy; 2026 EcoWorld Earth Products. All rights reserved.</p>
</footer>

<script src="assets/js/products-data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const catId = params.get('cat');
  const category = getCategoryById(catId);

  if (!category) {
    window.location.href = 'products.html';
  } else {
    // Update page title
    document.title = `${category.name} - EcoWorld.earth`;

    // Breadcrumb
    document.getElementById('breadcrumb').innerHTML = `
      <a href="index.html">Home</a><span class="sep">/</span>
      <a href="products.html">Products</a><span class="sep">/</span>
      <span>${category.name}</span>
    `;

    // Page Header
    document.getElementById('pageHeader').innerHTML = `
      <h1><i class="${category.icon}" style="color:#43a047;margin-right:0.5rem;"></i>${category.name}</h1>
      <p>${category.description}</p>
    `;

    // Sub-category cards
    const grid = document.getElementById('subcategoryGrid');
    category.subcategories.forEach(sub => {
      const hasNested = !!sub.subcategories;
      const productCount = countProducts(sub);
      const href = hasNested
        ? `subcategory.html?cat=${catId}&sub=${sub.id}`
        : `subcategory.html?cat=${catId}&sub=${sub.id}`;
      const metaText = hasNested
        ? `${sub.subcategories.length} types &middot; ${productCount} product${productCount > 1 ? 's' : ''}`
        : `${productCount} product${productCount > 1 ? 's' : ''}`;
      grid.innerHTML += `
        <a href="${href}" class="card">
          <div class="card-image">
            ${sub.image ? `<img src="${sub.image}" alt="${sub.name}">` : `<i class="${category.icon} placeholder-icon"></i>`}
          </div>
          <div class="card-body">
            <h3>${sub.name}</h3>
            <p>${sub.description}</p>
            <div class="card-meta">
              <span class="product-count">${metaText}</span>
            </div>
          </div>
          <div class="card-footer">
            <span class="card-link">${hasNested ? 'Explore Types' : 'View Products'} <i class="fas fa-arrow-right"></i></span>
          </div>
        </a>
      `;
    });
  }
  updateNavCartBadge();
</script>
</body>
</html>
