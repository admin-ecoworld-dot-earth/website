<!DOCTYPE HTML>
<html>
<head>
<title>Admin - Order Management | EcoWorld.earth</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
<link rel="stylesheet" href="assets/css/marketplace.css" />
<style>
  .admin-page { max-width: 1200px; margin: 0 auto; padding: 5.5rem 1rem 2rem; }
  .admin-page h1 { font-size: 1.6rem; color: #1b5e20; font-weight: 700; margin-bottom: 1rem; }

  .admin-filters {
    display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center;
    margin-bottom: 1.5rem; padding: 1rem; background: #f9fdf9;
    border: 1px solid #e8f5e9; border-radius: 8px;
  }
  .admin-filters select, .admin-filters input {
    padding: 0.5rem 0.8rem; border: 1px solid #ddd; border-radius: 6px;
    font-size: 0.85rem; background: #fff;
  }
  .admin-filters button {
    padding: 0.5rem 1.2rem; background: #2e7d32; color: #fff; border: none;
    border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
  }
  .admin-filters button:hover { background: #1b5e20; }

  .stats-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.8rem; margin-bottom: 1.5rem;
  }
  .stat-card {
    background: #fff; border: 1px solid #e8f5e9; border-radius: 8px;
    padding: 1rem; text-align: center;
  }
  .stat-card .stat-num { font-size: 1.5rem; font-weight: 700; color: #1b5e20; }
  .stat-card .stat-label { font-size: 0.75rem; color: #888; margin-top: 0.2rem; }

  .orders-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e8f5e9; }
  .orders-table th {
    background: #1b5e20; color: #fff; padding: 0.7rem 0.6rem;
    font-size: 0.78rem; text-align: left; font-weight: 600;
  }
  .orders-table td {
    padding: 0.6rem; font-size: 0.82rem; border-bottom: 1px solid #f0f0f0; vertical-align: top;
  }
  .orders-table tr:hover { background: #f9fdf9; }

  .status-badge {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px;
    font-size: 0.72rem; font-weight: 600; text-transform: capitalize;
  }
  .status-badge.placed { background: #fff3e0; color: #e65100; }
  .status-badge.confirmed { background: #e3f2fd; color: #1565c0; }
  .status-badge.processing { background: #f3e5f5; color: #7b1fa2; }
  .status-badge.shipped { background: #e8f5e9; color: #2e7d32; }
  .status-badge.out_for_delivery { background: #e0f7fa; color: #00695c; }
  .status-badge.delivered { background: #c8e6c9; color: #1b5e20; }
  .status-badge.cancelled { background: #ffebee; color: #c62828; }

  .pay-badge { font-size: 0.72rem; font-weight: 600; }
  .pay-badge.paid { color: #2e7d32; }
  .pay-badge.pending { color: #e65100; }
  .pay-badge.failed { color: #c62828; }

  .order-actions select {
    padding: 0.3rem 0.5rem; border: 1px solid #ddd; border-radius: 4px;
    font-size: 0.78rem; cursor: pointer;
  }
  .order-actions button {
    padding: 0.3rem 0.6rem; background: #2e7d32; color: #fff; border: none;
    border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-left: 0.3rem;
  }
  .order-actions button:hover { background: #1b5e20; }

  .order-items-list { font-size: 0.75rem; color: #555; line-height: 1.5; }

  .expand-btn {
    background: none; border: none; color: #2e7d32; cursor: pointer;
    font-size: 0.8rem; padding: 0;
  }
  .expand-btn:hover { text-decoration: underline; }

  .order-detail-row { display: none; }
  .order-detail-row td { background: #fafafa; padding: 1rem; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 0.82rem; }
  .detail-grid h4 { color: #1b5e20; margin: 0 0 0.5rem; font-size: 0.85rem; }
  .detail-grid p { margin: 0.2rem 0; color: #555; }

  .no-orders { text-align: center; padding: 3rem; color: #888; }

  .update-msg {
    position: fixed; top: 5rem; right: 1rem; padding: 0.8rem 1.5rem;
    background: #2e7d32; color: #fff; border-radius: 8px; font-size: 0.85rem;
    font-weight: 600; z-index: 999; display: none;
  }

  @media (max-width: 768px) {
    .orders-table { font-size: 0.75rem; }
    .orders-table th, .orders-table td { padding: 0.4rem; }
    .detail-grid { grid-template-columns: 1fr; }
    .admin-filters { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav class="nav">
  <a href="index.html" class="nav-brand">Eco<span>World</span>.earth</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li class="nav-cart"><a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span></a></li>
  </ul>
</nav>

<div class="update-msg" id="updateMsg"></div>

<div class="admin-page">
  <h1><i class="fas fa-clipboard-list"></i> Order Management</h1>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- Filters -->
  <div class="admin-filters">
    <select id="filterStatus">
      <option value="">All Statuses</option>
      <option value="placed">Placed</option>
      <option value="confirmed">Confirmed</option>
      <option value="processing">Processing</option>
      <option value="shipped">Shipped</option>
      <option value="out_for_delivery">Out for Delivery</option>
      <option value="delivered">Delivered</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <select id="filterPayment">
      <option value="">All Payments</option>
      <option value="paid">Paid</option>
      <option value="pending">Pending</option>
      <option value="failed">Failed</option>
    </select>
    <button onclick="loadOrders()"><i class="fas fa-search"></i> Filter</button>
    <button onclick="clearFilters()" style="background:#666;"><i class="fas fa-times"></i> Clear</button>
  </div>

  <!-- Orders Table -->
  <table class="orders-table">
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Date</th>
        <th>Customer</th>
        <th>Items</th>
        <th>Total</th>
        <th>Payment</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="ordersBody">
      <tr><td colspan="8" class="no-orders">Loading orders...</td></tr>
    </tbody>
  </table>
</div>

<script src="assets/js/products-data.js"></script>
<script>
  const API_BASE = 'https://ecoworld-web-service.onrender.com/api';
  const token = localStorage.getItem('ecoToken');
  const user = JSON.parse(localStorage.getItem('ecoUser') || 'null');

  // Auth check
  if (!token || !user) {
    alert('Please login first.');
    window.location.href = 'login.html';
  }

  const statusLabels = {
    placed: 'Placed', confirmed: 'Confirmed', processing: 'Processing',
    shipped: 'Shipped', out_for_delivery: 'Out for Delivery',
    delivered: 'Delivered', cancelled: 'Cancelled'
  };

  function showMsg(text, isError) {
    const el = document.getElementById('updateMsg');
    el.textContent = text;
    el.style.background = isError ? '#c62828' : '#2e7d32';
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  async function loadOrders() {
    const status = document.getElementById('filterStatus').value;
    const payment = document.getElementById('filterPayment').value;
    let url = `${API_BASE}/orders/admin/all?limit=100`;
    if (status) url += `&status=${status}`;
    if (payment) url += `&payment=${payment}`;

    try {
      const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();

      if (!data.success) {
        if (res.status === 403) {
          document.getElementById('ordersBody').innerHTML = '<tr><td colspan="8" class="no-orders" style="color:#c62828;">Access denied. Admin privileges required.</td></tr>';
          return;
        }
        throw new Error(data.message);
      }

      renderStats(data.orders);
      renderOrders(data.orders);
    } catch (err) {
      console.error(err);
      document.getElementById('ordersBody').innerHTML = `<tr><td colspan="8" class="no-orders" style="color:#c62828;">Error: ${err.message}</td></tr>`;
    }
  }

  function renderStats(orders) {
    const total = orders.length;
    const active = orders.filter(o => !['delivered', 'cancelled'].includes(o.orderStatus)).length;
    const delivered = orders.filter(o => o.orderStatus === 'delivered').length;
    const cancelled = orders.filter(o => o.orderStatus === 'cancelled').length;
    const revenue = orders.filter(o => o.paymentStatus === 'paid').reduce((s, o) => s + o.totalAmount, 0);

    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Orders</div></div>
      <div class="stat-card"><div class="stat-num">${active}</div><div class="stat-label">Active</div></div>
      <div class="stat-card"><div class="stat-num">${delivered}</div><div class="stat-label">Delivered</div></div>
      <div class="stat-card"><div class="stat-num">${cancelled}</div><div class="stat-label">Cancelled</div></div>
      <div class="stat-card"><div class="stat-num">₹${revenue.toLocaleString('en-IN')}</div><div class="stat-label">Revenue (Paid)</div></div>
    `;
  }

  function renderOrders(orders) {
    const tbody = document.getElementById('ordersBody');
    if (orders.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="no-orders">No orders found.</td></tr>';
      return;
    }

    tbody.innerHTML = orders.map(order => {
      const date = new Date(order.createdAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' });
      const time = new Date(order.createdAt).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      const itemsSummary = order.items.map(i => `${i.name} ×${i.quantity}`).join(', ');
      const shortItems = itemsSummary.length > 40 ? itemsSummary.substring(0, 40) + '...' : itemsSummary;

      return `
        <tr>
          <td><strong style="font-family:monospace;color:#1b5e20;">${order.orderId}</strong><br><button class="expand-btn" onclick="toggleDetail('${order.orderId}')"><i class="fas fa-chevron-down"></i> Details</button></td>
          <td>${date}<br><span style="color:#999;font-size:0.7rem;">${time}</span></td>
          <td><strong>${order.customer.name}</strong><br><span style="color:#888;font-size:0.75rem;">${order.customer.phone}</span><br><span style="color:#888;font-size:0.72rem;">${order.customer.city}</span></td>
          <td><span class="order-items-list" title="${itemsSummary}">${shortItems}</span></td>
          <td><strong>₹${order.totalAmount.toLocaleString('en-IN')}</strong></td>
          <td><span class="pay-badge ${order.paymentStatus}">${order.paymentStatus}</span><br><span style="font-size:0.7rem;color:#888;">${order.paymentMethod === 'cod' ? 'COD' : 'Online'}</span></td>
          <td><span class="status-badge ${order.orderStatus}">${statusLabels[order.orderStatus] || order.orderStatus}</span></td>
          <td class="order-actions">
            <select id="status-${order.orderId}">
              ${Object.keys(statusLabels).map(s => `<option value="${s}" ${s === order.orderStatus ? 'selected' : ''}>${statusLabels[s]}</option>`).join('')}
            </select>
            <button onclick="updateStatus('${order.orderId}')"><i class="fas fa-check"></i></button>
          </td>
        </tr>
        <tr class="order-detail-row" id="detail-${order.orderId}">
          <td colspan="8">
            <div class="detail-grid">
              <div>
                <h4><i class="fas fa-user"></i> Customer Details</h4>
                <p><strong>Name:</strong> ${order.customer.name}</p>
                <p><strong>Phone:</strong> ${order.customer.phone}</p>
                <p><strong>Email:</strong> ${order.customer.email || 'N/A'}</p>
                <p><strong>Address:</strong> ${order.customer.address}</p>
                <p><strong>City:</strong> ${order.customer.city} - ${order.customer.pincode}</p>
              </div>
              <div>
                <h4><i class="fas fa-box"></i> Order Items</h4>
                ${order.items.map(i => `<p>${i.name} × ${i.quantity} — ₹${(i.price * i.quantity).toLocaleString('en-IN')}</p>`).join('')}
                <hr style="margin:0.5rem 0;border-color:#e8f5e9;">
                <p><strong>Subtotal:</strong> ₹${(order.subtotal || 0).toLocaleString('en-IN')}</p>
                ${order.gstTotal ? `<p><strong>GST:</strong> ₹${order.gstTotal.toLocaleString('en-IN')}</p>` : ''}
                ${order.transportTotal ? `<p><strong>Transport:</strong> ₹${order.transportTotal.toLocaleString('en-IN')}</p>` : ''}
                <p style="font-weight:700;color:#1b5e20;"><strong>Total:</strong> ₹${order.totalAmount.toLocaleString('en-IN')}</p>
              </div>
            </div>
            <div style="margin-top:0.8rem;">
              <h4 style="color:#1b5e20;font-size:0.85rem;"><i class="fas fa-history"></i> Status History</h4>
              ${(order.statusHistory || []).map(h => `<p style="font-size:0.78rem;color:#666;margin:0.2rem 0;"><span class="status-badge ${h.status}" style="font-size:0.7rem;">${statusLabels[h.status] || h.status}</span> — ${new Date(h.timestamp).toLocaleString('en-IN')} ${h.note ? '(' + h.note + ')' : ''}</p>`).join('')}
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function toggleDetail(orderId) {
    const row = document.getElementById('detail-' + orderId);
    row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
  }

  async function updateStatus(orderId) {
    const newStatus = document.getElementById('status-' + orderId).value;
    const note = prompt('Add a note (optional):') || '';

    try {
      const res = await fetch(`${API_BASE}/orders/${orderId}/status`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ status: newStatus, note })
      });

      const data = await res.json();
      if (data.success) {
        showMsg(`Order ${orderId} → ${statusLabels[newStatus]}`);
        loadOrders();
      } else {
        showMsg(data.message || 'Update failed', true);
      }
    } catch (err) {
      showMsg('Error: ' + err.message, true);
    }
  }

  function clearFilters() {
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterPayment').value = '';
    loadOrders();
  }

  // Load on page load
  loadOrders();
  updateNavCartBadge();
</script>
</body>
</html>
